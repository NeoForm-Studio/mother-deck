  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') return { ...DEFAULTS, ...s }; }
    catch (e) {}
    return { ...DEFAULTS };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(vals)); } catch (e) {} }

  /* ── Rendering ───────────────────────────────────────────────── */
  function renderCmd(cmd) {
    let out = '', last = 0, m; TOKRE.lastIndex = 0;
    while ((m = TOKRE.exec(cmd))) {
      out += esc(cmd.slice(last, m.index));
      const v = vals[m[1]];
      out += v ? `<span class="subbed">${esc(v)}</span>` : `<span class="tok">&lt;${m[1]}&gt;</span>`;
      last = TOKRE.lastIndex;
    }
    out += esc(cmd.slice(last));
    return out;
  }
  function subst(cmd) { return cmd.replace(TOKRE, (_, k) => vals[k] || '<' + k + '>'); }

  function hlQuery(html, q) {
    if (!q) return html;
    // highlight only in already-escaped text nodes (avoid breaking tags/spans)
    return html.replace(/>([^<]+)</g, (mm, text) => {
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return '>' + text.replace(re, '<mark class="hl">$1</mark>') + '<';
    });
  }

  function matches(row, q) {
    if (!q) return true;
    return (row[1] + ' ' + row[2] + ' ' + row[3].join(' ')).toLowerCase().includes(q);
  }

  function renderCats() {
    const q = query.toLowerCase();
    const el = $('cats');
    const count = c => CMDS.filter(r => (c === 'ALL' || r[0] === c) && matches(r, q)).length;
    let html = navItem('ALL', 'ALL COMMANDS', count('ALL'));
    CATS.forEach(c => { html += navItem(c, c, count(c)); });
    el.innerHTML = html;
    el.querySelectorAll('.navitem').forEach(b =>
      b.addEventListener('click', () => { curCat = b.dataset.cat; renderCats(); renderCards(); }));
  }
  function navItem(cat, label, n) {
    const active = cat === curCat ? ' navitem--active' : '';
    return `<button class="navitem${active}" data-cat="${esc(cat)}">${esc(label)}<span class="count">${n}</span></button>`;
  }

  function renderCards() {
    const q = query.toLowerCase();
    const rows = CMDS.map((r, i) => [r, i]).filter(([r]) => (curCat === 'ALL' || r[0] === curCat) && matches(r, q));
    $('h-title').textContent = curCat === 'ALL' ? 'ALL COMMANDS' : curCat;
    $('h-sub').textContent = rows.length + (rows.length === 1 ? ' shown' : ' shown');
    const wrap = $('cards');
    if (!rows.length) {
      wrap.innerHTML = `<div class="empty"><div class="icon">▯</div><div class="big">NO MATCH</div><div class="dim">no commands match "${esc(query)}"</div></div>`;
      return;
    }
    wrap.innerHTML = rows.map(([r, i]) => {
      const tags = r[3].map(t => `<span class="tag">${esc(t)}</span>`).join('');
      const code = hlQuery(renderCmd(r[1]), query);
      return `<div class="card brackets">
        <div class="cmd-top">
          <span class="cmd-cat">${esc(r[0])}</span>
          <button class="copy-btn" data-i="${i}">⧉ COPY</button>
        </div>
        <div class="code">${code}</div>
        <div class="cmd-desc">${hlQuery(esc(r[2]), query)}</div>
        <div class="cmd-tags">${tags}</div>
      </div>`;
    }).join('');
  }

  function updateStats() {
    $('s-cmds').textContent = CMDS.length;
    $('s-cats').textContent = CATS.length;
    const filled = FIELDS.filter(f => (vals[f] || '').trim()).length;
    $('s-ph').textContent = filled + '/5';
    $('s-target').textContent = (vals.TARGET || '').trim() || '—';
  }

  /* ── Copy handling (delegated) ───────────────────────────────── */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(res => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); res();
    });
  }
  $('cards').addEventListener('click', e => {
    const btn = e.target.closest('.copy-btn'); if (!btn) return;
    const row = CMDS[+btn.dataset.i]; if (!row) return;
    copyText(subst(row[1])).then(() => {
      const card = btn.closest('.card'); const code = card && card.querySelector('.code');
      if (code) { code.classList.remove('flash'); void code.offsetWidth; code.classList.add('flash'); }
      const prev = btn.textContent; btn.textContent = '✔ COPIED'; btn.classList.add('copy-fb');
      setTimeout(() => { btn.textContent = prev; btn.classList.remove('copy-fb'); }, 900);
    });
  });

  /* ── Inputs ──────────────────────────────────────────────────── */
  FIELDS.forEach(f => {
    const el = $('p-' + f);
    el.value = vals[f] || '';
    el.addEventListener('input', () => { vals[f] = el.value; save(); updateStats(); renderCards(); });
  });
  $('q').addEventListener('input', () => { query = $('q').value.trim(); renderCats(); renderCards(); });
  $('btn-reset').addEventListener('click', () => {
    vals = { ...DEFAULTS }; save();
    FIELDS.forEach(f => { $('p-' + f).value = vals[f]; });
    updateStats(); renderCards();
  });

  /* ── Boot ────────────────────────────────────────────────────── */
  updateStats(); renderCats(); renderCards();
  </script>
</body>
</html>
